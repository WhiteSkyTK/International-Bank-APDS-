# .github/workflows/devsecops.yml
name: GlobalPay DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  codeql:
    name: SAST — CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: SCA — Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps 
      - name: Audit frontend dependencies
        run: npm audit --audit-level=critical
        continue-on-error: true          # warn but don't block
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install --legacy-peer-deps 
      - name: Audit backend dependencies
        working-directory: ./backend
        run: npm audit --audit-level=critical
        continue-on-error: true

  lint:
    name: Code Quality — ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - name: Run ESLint
        run: npx eslint src/ --ext .js,.jsx --max-warnings 30
        continue-on-error: true          # show warnings in log, don't block build

  api-tests:
    name: API Security Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install --legacy-peer-deps 
      - name: Run security tests
        working-directory: ./backend
        env:
          MONGO_URI:   mongodb://localhost:27017/globalpay_test
          JWT_SECRET:  test-secret-ci
          NODE_ENV:    test
        run: npm test
        continue-on-error: true          # tests shown in log even if some fail

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm run build